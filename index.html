<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BFSS Trading Community</title>

    <meta
      name="description"
      content="Official links for BFSS Trading Community. Join Telegram, YouTube, Instagram, VIP Compounding, Quotex and contact the admin."
    />

    <style>
      /* =========================================
       RESET
    ========================================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        font-family: Inter, Arial, Helvetica, sans-serif;
        background: #04080d;
        color: #ffffff;
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* =========================================
       BACKGROUND
    ========================================= */

      .background {
        position: fixed;
        inset: 0;
        z-index: -10;
        overflow: hidden;

        background:
          radial-gradient(
            circle at 50% -10%,
            rgba(0, 255, 174, 0.12),
            transparent 35%
          ),
          #04080d;
      }

      /* Moving Grid */

      .grid {
        position: absolute;
        inset: 0;

        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );

        background-size: 50px 50px;

        -webkit-mask-image: linear-gradient(to bottom, black, transparent);

        mask-image: linear-gradient(to bottom, black, transparent);

        animation: gridMove 18s linear infinite;
      }

      @keyframes gridMove {
        from {
          transform: translateY(0);
        }

        to {
          transform: translateY(50px);
        }
      }

      /* =========================================
       BACKGROUND BLOBS
    ========================================= */

      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.18;

        animation: blobMove 10s ease-in-out infinite alternate;
      }

      .blob-1 {
        width: 450px;
        height: 450px;
        background: #00f5a0;
        top: -220px;
        left: -200px;
      }

      .blob-2 {
        width: 480px;
        height: 480px;
        background: #008cff;
        right: -250px;
        top: 30%;
        animation-delay: -3s;
      }

      .blob-3 {
        width: 350px;
        height: 350px;
        background: #7447ff;
        bottom: -220px;
        left: 30%;
        animation-delay: -6s;
      }

      @keyframes blobMove {
        from {
          transform: translate(0, 0) scale(1);
        }

        to {
          transform: translate(40px, 40px) scale(1.1);
        }
      }

      /* =========================================
       PARTICLES
    ========================================= */

      #particles {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        bottom: -10px;

        width: 2px;
        height: 2px;

        border-radius: 50%;

        background: #6effbc;

        box-shadow: 0 0 12px rgba(110, 255, 188, 0.9);

        animation: particleMove linear infinite;
      }

      @keyframes particleMove {
        0% {
          transform: translateY(0);
          opacity: 0;
        }

        15% {
          opacity: 1;
        }

        75% {
          opacity: 0.7;
        }

        100% {
          transform: translateY(-115vh);
          opacity: 0;
        }
      }

      /* =========================================
       MOUSE GLOW
    ========================================= */

      .mouse-glow {
        position: fixed;

        width: 450px;
        height: 450px;

        border-radius: 50%;

        pointer-events: none;

        z-index: -2;

        transform: translate(-50%, -50%);

        background: radial-gradient(
          circle,
          rgba(0, 255, 170, 0.085),
          transparent 68%
        );
      }

      /* =========================================
       PAGE
    ========================================= */

      .page {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 44px 18px;
      }

      .container {
        width: 100%;
        max-width: 550px;
      }

      /* =========================================
       PROFILE
    ========================================= */

      .profile {
        text-align: center;
        margin-bottom: 32px;

        opacity: 0;

        animation: fadeUp 0.8s ease forwards;
      }

      /* =========================================
       BFSS LOGO
    ========================================= */

      .logo-wrapper {
        position: relative;

        width: 120px;
        height: 120px;

        margin: 0 auto 22px;

        padding: 2px;

        border-radius: 50%;

        background: linear-gradient(135deg, #00f5a0, #00a8ff, #8b5cf6);

        box-shadow:
          0 0 0 8px rgba(255, 255, 255, 0.025),
          0 0 50px rgba(0, 245, 160, 0.16);

        animation: logoFloat 4s ease-in-out infinite;
      }

      .logo-wrapper::before {
        content: "";

        position: absolute;
        inset: -10px;

        z-index: -1;

        border-radius: inherit;

        background: linear-gradient(
          135deg,
          rgba(0, 245, 160, 0.45),
          rgba(0, 168, 255, 0.3)
        );

        filter: blur(25px);

        animation: logoGlow 3s ease-in-out infinite;
      }

      .logo-inner {
        width: 100%;
        height: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        border-radius: 50%;

        background: #081018;

        border: 3px solid #04080d;
      }

      .logo-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-7px);
        }
      }

      @keyframes logoGlow {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.95);
        }

        50% {
          opacity: 0.8;
          transform: scale(1.08);
        }
      }

      /* =========================================
       ONLINE DOT
    ========================================= */

      .online {
        position: absolute;

        right: 8px;
        bottom: 8px;

        width: 20px;
        height: 20px;

        border-radius: 50%;

        background: #36f59e;

        border: 4px solid #04080d;

        box-shadow: 0 0 18px rgba(54, 245, 158, 0.9);
      }

      .online::after {
        content: "";

        position: absolute;
        inset: -5px;

        border-radius: 50%;

        border: 1px solid rgba(54, 245, 158, 0.7);

        animation: onlinePulse 2s ease-out infinite;
      }

      @keyframes onlinePulse {
        from {
          transform: scale(0.5);
          opacity: 1;
        }

        to {
          transform: scale(1.7);
          opacity: 0;
        }
      }

      /* =========================================
       BADGE
    ========================================= */

      .badge {
        display: inline-flex;
        align-items: center;

        gap: 7px;

        margin-bottom: 14px;

        padding: 7px 12px;

        border-radius: 999px;

        border: 1px solid rgba(90, 255, 185, 0.17);

        background: rgba(90, 255, 185, 0.055);

        color: #76ffc4;

        font-size: 10px;
        font-weight: 800;

        letter-spacing: 1.5px;

        text-transform: uppercase;
      }

      .badge-dot {
        width: 6px;
        height: 6px;

        border-radius: 50%;

        background: #43ffaf;

        box-shadow: 0 0 10px #43ffaf;
      }

      /* =========================================
       HEADING
    ========================================= */

      h1 {
        margin-bottom: 12px;

        font-size: clamp(30px, 7vw, 44px);

        line-height: 1.05;

        letter-spacing: -1.6px;
      }

      .gradient-title {
        color: transparent;

        background: linear-gradient(
          100deg,
          #ffffff 10%,
          #caffea 40%,
          #6affbd 70%,
          #70baff 100%
        );

        background-size: 200% auto;

        -webkit-background-clip: text;
        background-clip: text;

        animation: textGradient 5s linear infinite;
      }

      @keyframes textGradient {
        to {
          background-position: 200% center;
        }
      }

      .description {
        width: 100%;
        max-width: 440px;

        margin: auto;

        color: #84909f;

        font-size: 14px;

        line-height: 1.7;
      }

      /* =========================================
       LINKS
    ========================================= */

      .links {
        display: flex;
        flex-direction: column;

        gap: 12px;
      }

      .link-card {
        position: relative;

        min-height: 75px;

        display: flex;
        align-items: center;

        overflow: hidden;

        padding: 13px 15px;

        border-radius: 18px;

        border: 1px solid rgba(255, 255, 255, 0.075);

        background: linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.015)
        );

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

        opacity: 0;

        transform: translateY(22px);

        transition:
          transform 0.35s ease,
          border-color 0.35s ease,
          box-shadow 0.35s ease;
      }

      /* Shine animation */

      .link-card::before {
        content: "";

        position: absolute;

        width: 90px;
        height: 180px;

        top: -55px;
        left: -140px;

        transform: rotate(25deg);

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );

        transition: left 0.7s ease;
      }

      .link-card::after {
        content: "";

        position: absolute;

        inset: 0;

        opacity: 0;

        pointer-events: none;

        background: radial-gradient(
          circle at 0% 50%,
          var(--glow),
          transparent 45%
        );

        transition: opacity 0.3s ease;
      }

      .link-card:hover {
        transform: translateY(-4px) scale(1.008);

        border-color: rgba(255, 255, 255, 0.15);

        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
      }

      .link-card:hover::before {
        left: calc(100% + 120px);
      }

      .link-card:hover::after {
        opacity: 1;
      }

      .link-card:active {
        transform: scale(0.98);
      }

      /* =========================================
       ICON
    ========================================= */

      .icon {
        position: relative;
        z-index: 2;

        width: 49px;
        height: 49px;

        flex-shrink: 0;

        display: grid;
        place-items: center;

        margin-right: 14px;

        border-radius: 14px;

        color: var(--icon-color);

        background: var(--icon-background);

        transition:
          transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          box-shadow 0.35s ease;
      }

      .icon svg {
        width: 23px;
        height: 23px;
      }

      .icon img {
        width: 34px;
        height: 34px;

        object-fit: contain;

        display: block;

        border-radius: 7px;
      }

      .link-card:hover .icon {
        transform: scale(1.1) rotate(-5deg);

        box-shadow: 0 0 25px var(--icon-shadow);
      }

      /* Quotex icon */

      .icon.quotex-icon {
        background: rgba(255, 55, 80, 0.08);

        padding: 6px;
      }

      .icon.quotex-icon img {
        width: 100%;
        height: 100%;

        border-radius: 9px;

        object-fit: cover;
      }

      /* =========================================
       TEXT
    ========================================= */

      .link-content {
        position: relative;

        z-index: 2;

        flex: 1;

        min-width: 0;
      }

      .link-title {
        margin-bottom: 5px;

        color: #f8fafc;

        font-size: 15px;

        font-weight: 700;
      }

      .link-description {
        color: #74808f;

        font-size: 12px;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
      }

      /* =========================================
       ARROW
    ========================================= */

      .arrow {
        position: relative;

        z-index: 2;

        width: 34px;
        height: 34px;

        flex-shrink: 0;

        margin-left: 10px;

        display: grid;
        place-items: center;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.045);

        color: #7d8794;

        transition:
          transform 0.3s ease,
          background 0.3s ease,
          color 0.3s ease;
      }

      .arrow svg {
        width: 16px;
        height: 16px;
      }

      .link-card:hover .arrow {
        transform: translateX(4px);

        background: #ffffff;

        color: #04080d;
      }

      /* =========================================
       FOOTER
    ========================================= */

      footer {
        margin-top: 28px;

        text-align: center;

        color: #4f5967;

        font-size: 11px;

        line-height: 1.8;

        opacity: 0;

        animation: fadeUp 0.7s ease 1.1s forwards;
      }

      footer strong {
        color: #8c96a3;

        font-weight: 600;
      }

      /* =========================================
       ENTRY ANIMATION
    ========================================= */

      @keyframes fadeUp {
        from {
          opacity: 0;

          transform: translateY(22px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      /* =========================================
       MOBILE
    ========================================= */

      @media (max-width: 520px) {
        .page {
          padding: 30px 14px;
        }

        .profile {
          margin-bottom: 27px;
        }

        .logo-wrapper {
          width: 105px;
          height: 105px;

          margin-bottom: 18px;
        }

        h1 {
          font-size: 32px;
        }

        .description {
          font-size: 13px;
        }

        .link-card {
          min-height: 69px;

          padding: 11px 12px;

          border-radius: 16px;
        }

        .icon {
          width: 45px;
          height: 45px;

          margin-right: 12px;

          border-radius: 13px;
        }

        .icon svg {
          width: 21px;
          height: 21px;
        }

        .link-title {
          font-size: 14px;
        }

        .link-description {
          font-size: 11px;
        }

        .arrow {
          width: 31px;
          height: 31px;
        }
      }

      @media (hover: none) {
        .mouse-glow {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;

          animation-iteration-count: 1 !important;

          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background -->

    <div class="background">
      <div class="grid"></div>

      <div class="blob blob-1"></div>

      <div class="blob blob-2"></div>

      <div class="blob blob-3"></div>

      <div id="particles"></div>
    </div>

    <div class="mouse-glow" id="mouseGlow"></div>

    <!-- Main -->

    <main class="page">
      <div class="container">
        <!-- Profile -->

        <section class="profile">
          <div class="logo-wrapper">
            <div class="logo-inner">
              <!-- BFSS LOGO -->

              <img src="./image/logo.jpg" alt="BFSS Trading Community Logo" />
            </div>

            <span class="online"></span>
          </div>

          <div class="badge">
            <span class="badge-dot"></span>

            Official Community
          </div>

          <h1>
            <span class="gradient-title"> BFSS Trading Community </span>
          </h1>

          <p class="description">
            Connect with the official BFSS community, trading content, VIP
            compounding, Quotex registration and administration support.
          </p>
        </section>

        <!-- Links generated using JavaScript -->

        <section class="links" id="links"></section>

        <!-- Footer -->

        <footer>
          <strong> © 2026 BFSS Trading Community </strong>

          <br />

          Trading involves financial risk. Trade responsibly.
        </footer>
      </div>
    </main>

    <script>
      /*
      =============================================
      EDIT YOUR LINKS HERE
      =============================================
    */

      const communityLinks = [
        /* 1. TELEGRAM */

        {

          background: "rgba(42,171,238,0.12)",

          shadow: "rgba(42,171,238,0.30)",

          glow: "rgba(42,171,238,0.07)",

          icon: `
          <svg
            viewBox="0 0 24 24"

            <path
              d="M21.944 2.506c-.178-.15-.44-.18-.64-.073L2.31 10.763c-.234.103-.375.34-.35.595.025.255.21.465.458.522l4.86 1.118 1.83 5.44c.074.221.273.376.505.394h.045c.215 0 .416-.115.524-.302l2.29-3.968 4.512 3.522c.15.117.346.157.53.108.184-.048.333-.18.401-.358L22.15 3.17a.597.597 0 0 0-.206-.664ZM9.56 17.017l-1.254-3.725 8.436-6.75-6.375 7.614-.807 2.861Z"
            />

        `,
        },

        /* 2. YOUTUBE */

        {
          title: "YouTube",

          color: "#FF4040",

          background: "rgba(255,64,64,0.11)",

          glow: "rgba(255,64,64,0.07)",

          icon: `

            />
          </svg>
        `,
        },

        /* 3. INSTAGRAM */

        {
          title: "Instagram",

          description: "Follow BFSS for market updates and content",

          url: "https://instagram.com/YOUR_USERNAME",

          color: "#FF64B3",

          background: "rgba(255,100,179,0.11)",

          shadow: "rgba(255,100,179,0.28)",

          icon: `

          </svg>
        `,
        },

        /* 4. VIP COMPOUNDING */

        {
          title: "VIP Compounding",

          description: "Join our BFSS VIP compounding community",

          url: "https://t.me/YOUR_VIP_LINK",

          color: "#FFD166",

          background: "rgba(255,209,102,0.11)",

          shadow: "rgba(255,209,102,0.28)",

          glow: "rgba(255,209,102,0.07)",

          icon: `
          <svg
            viewBox="0 0 24 24"
            fill="none"

        },

        /* 5. QUOTEX REGISTRATION */

        {
          title: "Quotex Registration",

          description: "Create your Quotex trading account",

          url: "https://broker-qx.pro/sign-up/fast/?lid=YOUR_LID",

          color: "#FF3152",

          background: "rgba(255,49,82,0.10)",

          shadow: "rgba(255,49,82,0.30)",

          glow: "rgba(255,49,82,0.08)",

          customClass: "quotex-icon",

          icon: `
          <img
            src="./image/quotex.png"
            alt="Quotex Logo"
          />
        `,
        },

        /* 6. CONTACT ADMIN */

        {
          title: "Contact Admin",

          description: "@YOUR_ADMIN_USERNAME",

          url: "https://t.me/YOUR_ADMIN_USERNAME",

          color: "#9D8CFF",

          background: "rgba(157,140,255,0.12)",

          shadow: "rgba(157,140,255,0.28)",

          glow: "rgba(157,140,255,0.07)",

          icon: `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <circle
              cx="12"
              cy="8"
              r="4"
            ></circle>

            <path
              d="M4.5 21a7.5 7.5 0 0 1 15 0"
            ></path>

          </svg>
        `,
        },
      ];

      /*
      =============================================
      ARROW ICON
      =============================================
    */

      const arrowIcon = `
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >

        <path
          d="M5 12h14"
        ></path>

        <path
          d="m13 6 6 6-6 6"
        ></path>

      </svg>
    `;

      /*
      =============================================
      RENDER DATA
      =============================================
    */

      const linksContainer = document.getElementById("links");

      communityLinks.forEach((item, index) => {
        const link = document.createElement("a");

        link.href = item.url;

        link.target = "_blank";

        link.rel = "noopener noreferrer";

        link.className = "link-card";

        link.style.setProperty("--icon-color", item.color);

        link.style.setProperty("--icon-background", item.background);

        link.style.setProperty("--icon-shadow", item.shadow);

        link.style.setProperty("--glow", item.glow);

        link.style.animation = `fadeUp 0.65s ease ${
          0.25 + index * 0.09
        }s forwards`;

        link.innerHTML = `

          <div
            class="icon ${item.customClass || ""}"
          >
            ${item.icon}
          </div>


          <div class="link-content">

            <div class="link-title">
              ${item.title}
            </div>

            <div class="link-description">
              ${item.description}
            </div>

          </div>


          <div class="arrow">
            ${arrowIcon}
          </div>

        `;

        linksContainer.appendChild(link);
      });

      /*
      =============================================
      PARTICLES
      =============================================
    */

      const particles = document.getElementById("particles");

      const particleCount = 25;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement("span");

        particle.className = "particle";

        particle.style.left = `${Math.random() * 100}%`;

        const size = 1 + Math.random() * 2;

        particle.style.width = `${size}px`;

        particle.style.height = `${size}px`;

        particle.style.animationDuration = `${8 + Math.random() * 12}s`;

        particle.style.animationDelay = `${Math.random() * -20}s`;

        particles.appendChild(particle);
      }

      /*
      =============================================
      MOUSE FOLLOW GLOW
      =============================================
    */

      const mouseGlow = document.getElementById("mouseGlow");

      window.addEventListener("mousemove", (event) => {
        mouseGlow.style.left = `${event.clientX}px`;

        mouseGlow.style.top = `${event.clientY}px`;
      });
    </script>
  </body>
</html>
